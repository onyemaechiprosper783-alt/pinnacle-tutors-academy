<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Pinnacle Tutors Academy — Offline</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f7f7f8;
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;

      .card {
        text-align: center;
        max-width: 560px;
      }

      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin-bottom: 16px;
      }

      a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <img src="/icon-192.png" alt="Pinnacle Tutors Academy" />
      <h1>You're offline</h1>
      <p>
        It looks like you don't have an internet connection right now.
        Please reconnect and try again.
      </p>
      <p><a href="/">Return to Pinnacle Tutors Academy</a></p>
    </main>
  </body>
</html>
