<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Pinnacle Tutors — Offline</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#0f172a}
    @media(prefers-color-scheme:dark){:root{background:#0f172a;color:#f1f5f9}}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(460px,100%);padding:32px;border:1px solid #c7d2fe;border-radius:24px;background:#eef2ff;box-shadow:0 18px 50px rgba(49,46,129,.12);text-align:center}
    @media(prefers-color-scheme:dark){main{background:#1e2948;border-color:#374151}}
    .logo{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;object-fit:contain;background:#fff}
    h1{margin:0 0 10px;font-size:25px}p{line-height:1.6;color:#475569}button{border:0;border-radius:14px;padding:13px 20px;background:#4f46e5;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/pinnacle-logo.png" alt="Pinnacle Tutors Academy">
    <h1>You're offline</h1>
    <p>Your previously opened Pinnacle Tutors pages and saved app content can still be available offline. Reconnect to load anything you haven't cached yet.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
