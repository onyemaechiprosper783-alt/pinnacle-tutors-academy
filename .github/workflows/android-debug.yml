name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify PWA icons
        run: |
          test -s public/icon-192.png
          test -s public/icon-512.png
          node - <<'NODE'
          const fs = require('fs');
          for (const p of ['public/icon-192.png','public/icon-512.png']) {
            const b = fs.readFileSync(p);
            if (b.readUInt32BE(0) !== 0x89504e47) throw new Error(`${p} is not PNG`);
            console.log(`${p}: ${b.readUInt32BE(16)}x${b.readUInt32BE(20)}`);
          }
          NODE

      - name: Prepare launcher icons
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp public/icon-192.png android/app/src/main/res/drawable/icon_192.png
          cp public/icon-512.png android/app/src/main/res/drawable/icon_512.png

      - name: Check Android project
        run: test -f android/settings.gradle && test -f android/app/src/main/AndroidManifest.xml

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.11.1/bin >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinnacle-tutors-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
