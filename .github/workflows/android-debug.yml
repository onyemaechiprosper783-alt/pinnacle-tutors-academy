name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare local WebView bootstrap
        run: |
          mkdir -p public
          test -f public/icon-192.png
          if [ ! -f public/icon-512.png ]; then
            cp public/icon-192.png public/icon-512.png
          fi
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#ffffff">
            <link rel="icon" href="./icon-192.png">
            <link rel="apple-touch-icon" href="./icon-512.png">
            <title>Pinnacle Tutors Academy</title>
            <style>html,body{margin:0;width:100%;height:100%;background:#fff}#boot{width:100%;height:100%;border:0}</style>
          </head>
          <body>
            <iframe id="boot" title="Pinnacle Tutors Academy"></iframe>
            <script>
              document.getElementById('boot').src='https://pinnacle-tutors-a-git-e8bee1-onyemaechiprosper783-alts-projects.vercel.app/';
            </script>
          </body>
          </html>
          EOF
          test -s public/index.html

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Configure Capacitor standalone WebView
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.pinnacletutorsacademy.app',
            appName: 'Pinnacle Tutors Academy',
            webDir: 'public',
            server: { androidScheme: 'https' }
          };
          export default config;
          EOF
          npx cap sync android

      - name: Configure PWA launcher icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp public/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp public/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp public/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('</manifest>', '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>')
          if 'android:roundIcon=' not in s:
              s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinnacle-tutors-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
