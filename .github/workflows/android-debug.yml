name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p public
          if [ ! -f public/index.html ]; then
            printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > public/index.html
          fi
          test -f public/index.html
          test -f public/icon-192.png

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Capacitor for the latest PWA deployment
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.pinnacletutorsacademy.app',
            appName: 'Pinnacle Tutors Academy',
            webDir: 'public',
            server: {
              url: 'https://pinnacle-tutors-a-git-e8bee1-onyemaechiprosper783-alts-projects.vercel.app',
              cleartext: false,
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android launcher icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp public/icon-192.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp public/icon-192.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher" />
          </adaptive-icon>
          EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
          </shape>
          EOF
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Ensure Android can access HTTPS deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:android="http://schemas.android.com/apk/res/android" ', 1) if 'xmlns:android=' not in s else s
              s = s.replace('<application ', '<uses-permission android:name="android.permission.INTERNET" />\n    <application ', 1)
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinnacle-tutors-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
