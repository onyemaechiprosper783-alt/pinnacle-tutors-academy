name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package PWA launcher icon into Android resources
        run: |
          set -e
          test -s public/icon-192.png
          mkdir -p \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi

          # icon-192.png is present on android-app and is the authoritative
          # launcher asset for this branch. Use icon-512.png when available
          # for the higher-density resources; otherwise safely fall back to
          # the same PWA icon rather than failing the build.
          cp public/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp public/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp public/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp public/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          if [ -s public/icon-512.png ]; then
            ICON_HI=public/icon-512.png
          else
            ICON_HI=public/icon-192.png
          fi

          cp "$ICON_HI" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "$ICON_HI" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp "$ICON_HI" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp "$ICON_HI" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Check Android project
        run: test -f android/settings.gradle && test -f android/app/src/main/AndroidManifest.xml

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.11.1/bin >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinnacle-tutors-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
