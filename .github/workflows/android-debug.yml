name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor bootstrap page
        run: |
          mkdir -p public
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > public/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Capacitor to load the deployed PWA
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'capacitor.config.ts';
          let config = fs.readFileSync(path, 'utf8');
          config = config.replace(/server:\s*\{[\s\S]*?\},?\s*/m, '');
          config = config.replace(/export default\s*\{/, `export default {\n  server: { url: 'https://pinnacle-tutors-academy-ad3i.vercel.app', cleartext: false },`);
          fs.writeFileSync(path, config);
          NODE
          rm -f public/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Pinnacle app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp public/icon-192.png android/app/src/main/res/drawable/pinnacle_icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp public/icon-192.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp public/icon-192.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinnacle-tutors-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
