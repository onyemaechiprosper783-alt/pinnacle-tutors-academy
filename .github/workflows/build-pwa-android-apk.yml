name: Build PWA Android APK

on:
  workflow_dispatch:
  push:
    branches: [pwa-android-apk]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete PWA source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # The PWA is a Next.js application, so it is not a static Capacitor export.
      # Package a native Capacitor shell that loads the same production PWA URL
      # inside the Android WebView instead of redirecting the user to Chrome.
      - name: Prepare Capacitor entry point
        run: |
          mkdir -p public
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
              <meta name="theme-color" content="#047857">
              <title>Pinnacle Tutors Academy</title>
            </head>
            <body>
              <div id="app-loading" style="font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
                Loading Pinnacle Tutors Academy…
              </div>
            </body>
          </html>
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Capacitor to load the complete deployed PWA in-app
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.pinnacletutors.academy',
            appName: 'Pinnacle Tutors Academy',
            webDir: 'public',
            server: {
              url: 'https://pinnacle-tutors-academy-ad3i.vercel.app',
              cleartext: false,
            },
          };

          export default config;
          EOF
          npx cap copy android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinnacle-tutors-academy-pwa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
