name: Generate npm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - pwa

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pwa branch
        uses: actions/checkout@v4
        with:
          ref: pwa
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Verify lockfile and web-push
        run: |
          test -f package-lock.json
          node -e "const p=require('./package-lock.json'); if(!p.packages || !p.packages['node_modules/web-push']) process.exit(1)"

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git push origin HEAD:pwa
