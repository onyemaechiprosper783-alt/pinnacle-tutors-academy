name: Generate npm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - pwa

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pwa branch
        uses: actions/checkout@v4
        with:
          ref: pwa
          fetch-depth: 0

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lockfile and web-push
        run: |
          test -f package-lock.json
          node -e "const p=require('./package-lock.json'); if(!p.packages || !p.packages['node_modules/web-push']) { console.error('web-push missing from lockfile'); process.exit(1) }"

      - name: Commit lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already tracked and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:pwa
